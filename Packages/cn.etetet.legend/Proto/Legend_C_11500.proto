syntax = "proto3";

package ET;

// ResponseType G2C_LegendEnterMap
message C2G_LegendEnterMap // ISessionRequest
{
    int32 RpcId = 1;
}

message G2C_LegendEnterMap // ISessionResponse
{
    int32 RpcId = 1;
    int32 Error = 2;
    string Message = 3;
    int64 MapSceneId = 4;
    string MapName = 5;
    int64 UnitId = 6;
}

message LegendUnitInfo
{
    int64 UnitId = 1;
    int32 ConfigId = 2;
    int32 X = 3;
    int32 Y = 4;
    int64 Hp = 5;
    int64 MaxHp = 6;
}

// ResponseType M2C_LegendAttack
message C2M_LegendAttack // ILocationRequest
{
    int32 RpcId = 1;
    int64 TargetUnitId = 2;
}

message M2C_LegendAttack // ILocationResponse
{
    int32 RpcId = 1;
    int32 Error = 2;
    string Message = 3;
}

message M2C_LegendHit // IMessage
{
    int64 AttackerId = 1;
    int64 TargetId = 2;
    int32 Damage = 3;
    int64 Hp = 4;
}

message M2C_LegendUnitsAppear // IMessage
{
    repeated LegendUnitInfo Units = 1;
}

message M2C_LegendUnitsDisappear // IMessage
{
    repeated int64 UnitIds = 1;
}

// ResponseType LegendClient2Cli_Command
message Cli2LegendClient_Command // IRequest
{
    int32 RpcId = 1;
    string Command = 2;
    repeated string Args = 3;
}

message LegendClient2Cli_Command // IResponse
{
    int32 RpcId = 1;
    int32 Error = 2;
    string Message = 3;
}
